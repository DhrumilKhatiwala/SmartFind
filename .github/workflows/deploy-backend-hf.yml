name: Sync Backend to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-hf.yml'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub
        run: pip install --upgrade huggingface_hub

      - name: Upload backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python -c "
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          username = os.environ.get('HF_USERNAME')
          space_name = os.environ.get('HF_SPACE_NAME')

          if not token or not username or not space_name:
              print('Error: Missing HF_TOKEN, HF_USERNAME, or HF_SPACE_NAME secrets.')
              sys.exit(1)

          repo_id = f'{username.strip()}/{space_name.strip()}'
          print(f'Uploading backend folder to Hugging Face Space: {repo_id}...')

          api = HfApi(token=token.strip())
          api.upload_folder(
              folder_path='backend',
              repo_id=repo_id,
              repo_type='space',
              ignore_patterns=['data/**', '__pycache__/**', '*.pyc', '.env', 'venv/**', '.venv/**', '*.csv']
          )
          print('Successfully synced backend to Hugging Face Space!')
          "
