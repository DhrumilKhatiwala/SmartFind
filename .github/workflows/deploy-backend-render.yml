name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-render.yml'
  workflow_dispatch:

jobs:
  deploy-to-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Notice: RENDER_DEPLOY_HOOK_URL secret is not set. Render will use automatic git-push webhooks if connected directly."
          else
            echo "Triggering Render deployment webhook..."
            curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully!"
          fi
